name: Deploy to server (Manual)

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Backend image tag (default: main)"
        required: false
        default: "main"
      admin_tag:
        description: "Admin-web image tag (default: main)"
        required: false
        default: "main"
      confirm:
        description: "Type DEPLOY_NOW to continue"
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY_NOW' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate inputs
        env:
          BACKEND_TAG: ${{ github.event.inputs.backend_tag }}
          ADMIN_TAG: ${{ github.event.inputs.admin_tag }}
        run: |
          set -euo pipefail
          tag_regex='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if ! printf '%s' "${BACKEND_TAG}" | grep -Eq "${tag_regex}"; then
            echo "Invalid backend_tag: ${BACKEND_TAG}"
            exit 1
          fi
          if ! printf '%s' "${ADMIN_TAG}" | grep -Eq "${tag_regex}"; then
            echo "Invalid admin_tag: ${ADMIN_TAG}"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy selected version tags
        env:
          BACKEND_IMAGE_TAG: ${{ github.event.inputs.backend_tag }}
          ADMIN_WEB_IMAGE_TAG: ${{ github.event.inputs.admin_tag }}
          SSH_HOST: ${{ vars.SSH_HOST != '' && vars.SSH_HOST || secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT != '' && vars.SSH_PORT || secrets.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER != '' && vars.SSH_USER || secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH != '' && vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME != '' && vars.GHCR_USERNAME || secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL != '' && vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD != '' && vars.ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ vars.ADMIN_JWT_SECRET != '' && vars.ADMIN_JWT_SECRET || secrets.ADMIN_JWT_SECRET }}
          SERVER_NAME: ${{ vars.SERVER_NAME != '' && vars.SERVER_NAME || secrets.SERVER_NAME }}
          ENABLE_HTTPS: ${{ vars.ENABLE_HTTPS != '' && vars.ENABLE_HTTPS || secrets.ENABLE_HTTPS }}
          SSL_CERT_PATH: ${{ vars.SSL_CERT_PATH != '' && vars.SSL_CERT_PATH || secrets.SSL_CERT_PATH }}
          SSL_KEY_PATH: ${{ vars.SSL_KEY_PATH != '' && vars.SSL_KEY_PATH || secrets.SSL_KEY_PATH }}
        run: bash scripts/deploy/manual-deploy.sh
