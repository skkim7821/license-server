name: Publish Docker image to GHCR

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional additional image tag to publish (for example: v0.2.1)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/license-server.Dockerfile
          push: true
          tags: |
            ${{ github.event_name == 'workflow_dispatch' && format('ghcr.io/{0}:main', github.repository) || '' }}
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' && format('ghcr.io/{0}:{1}', github.repository, github.event.inputs.image_tag) || '' }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract admin-web Docker metadata
        id: meta_admin
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-admin-web
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push admin-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/admin-web.Dockerfile
          push: true
          tags: |
            ${{ github.event_name == 'workflow_dispatch' && format('ghcr.io/{0}-admin-web:main', github.repository) || '' }}
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' && format('ghcr.io/{0}-admin-web:{1}', github.repository, github.event.inputs.image_tag) || '' }}
            ${{ steps.meta_admin.outputs.tags }}
          labels: ${{ steps.meta_admin.outputs.labels }}
