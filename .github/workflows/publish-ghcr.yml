name: Publish Docker image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to server
        env:
          SSH_HOST: ${{ vars.SSH_HOST != '' && vars.SSH_HOST || secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT != '' && vars.SSH_PORT || secrets.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER != '' && vars.SSH_USER || secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH != '' && vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME != '' && vars.GHCR_USERNAME || secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "export DEPLOY_PATH='${DEPLOY_PATH}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}'; bash -se" << 'EOF'
          set -euo pipefail

          case "${DEPLOY_PATH}" in
            "~")
              DEPLOY_PATH="${HOME}"
              ;;
            "~/"*)
              DEPLOY_PATH="${HOME}/${DEPLOY_PATH#~/}"
              ;;
          esac

          if [ ! -d "${DEPLOY_PATH}" ]; then
            echo "DEPLOY_PATH does not exist: ${DEPLOY_PATH}"
            exit 1
          fi

          if [ ! -d "${DEPLOY_PATH}/.git" ]; then
            echo "DEPLOY_PATH is not a git repo: ${DEPLOY_PATH}"
            exit 1
          fi

          cd "${DEPLOY_PATH}"
          git pull --ff-only

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          docker compose pull || true
          docker compose up -d --build

          docker compose ps
          curl -fsS http://127.0.0.1/health >/dev/null
          EOF
