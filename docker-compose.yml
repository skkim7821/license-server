services:
  postgres:
    image: postgres:16
    container_name: license-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: license_server
      POSTGRES_USER: license
      POSTGRES_PASSWORD: license
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U license -d license_server"]
      interval: 5s
      timeout: 5s
      retries: 20

  license-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: license-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://license:license@postgres:5432/license_server?schema=public
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: license-admin-web
    restart: unless-stopped
    depends_on:
      license-server:
        condition: service_healthy
    ports:
      - "5174:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
